# Majors are deliberate, scheduled upgrades (eslint flat config, vitest, the
# VS Code engine range); the bot only proposes minors and patches. Action
# majors stay enabled: they are small and CI-gated.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    versioning-strategy: increase-if-necessary
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      - dependency-name: '*'
        update-types: ['version-update:semver-major']
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
